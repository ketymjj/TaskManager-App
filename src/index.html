<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>TaskManagerApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fontes do Google para o estilo de post-it -->
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Gochi+Hand&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos globais para os post-its -->
  <style>
    :root {
      --post-it-yellow: #ffc;
      --post-it-blue: #c9daf8;
      --post-it-pink: #f4cccc;
      --post-it-green: #d9ead3;
      --shadow-color: rgba(0, 0, 0, 0.2);
    }

    body {
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      min-height: 100vh;
      padding: 20px;
      font-family: 'Roboto', sans-serif;
    }

    .page-title {
      font-family: 'Permanent Marker', cursive;
      color: white;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 2.5rem;
    }

    .post-it-container {
      padding: 25px;
      margin: 20px 0;
      border-radius: 5px;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2),
                  0 0 15px rgba(255, 255, 255, 0.3) inset;
      transform: rotate(-1deg);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .post-it-container:hover {
      transform: rotate(0deg) scale(1.01);
      box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.25),
                  0 0 15px rgba(255, 255, 255, 0.4) inset;
    }

    .post-it-content {
      padding: 15px;
    }

    .post-it-container::after {
      content: '';
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 50%);
    }

    .yellow {
      background-color: var(--post-it-yellow);
      border: 1px solid #e6d7a3;
    }

    .blue {
      background-color: var(--post-it-blue);
      border: 1px solid #a3bae6;
    }

    .pink {
      background-color: var(--post-it-pink);
      border: 1px solid #e6a3a3;
    }

    .green {
      background-color: var(--post-it-green);
      border: 1px solid #b6d7a8;
    }

    .form-label {
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
      font-family: 'Gochi Hand', cursive;
      font-size: 1.2rem;
    }

    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      padding: 10px;
      font-family: 'Gochi Hand', cursive;
      font-size: 1.1rem;
    }

    .form-control:focus, .form-select:focus {
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 0.3rem rgba(50, 194, 241, 0.25);
      border-color: #6e8efb;
    }

    .btn-postit {
      background-color: #6e8efb;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-postit:hover {
      background-color: #5a7de0;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
    }

    .btn-postit-secondary {
      background-color: #a777e3;
      border: none;
      color: white;
      padding: 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      font-family: 'Permanent Marker', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-postit-secondary:hover {
      background-color: #9565d0;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
    }

    .priority-indicator {
      display: inline-block;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .priority-high { background-color: #ff5252; }
    .priority-medium { background-color: #ffb142; }
    .priority-low { background-color: #2ed573; }

    @media (max-width: 768px) {
      .post-it-container {
        padding: 15px;
      }

      .page-title {
        font-size: 2rem;
      }

      .btn-postit, .btn-postit-secondary {
        width: 100% !important;
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <!-- Scripts do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
