<div class="container mt-5">
    <h1 class="page-title">Gerenciador de Projetos</h1>

    <div class="d-grid gap-2 mb-4">
        <button class="btn btn-postit" [routerLink]="['/cadastro']">
            📌 Cadastrar novo projeto
        </button>
    </div>

    <div class="post-it-container blue mb-4">
        <div class="post-it-content">
            <label class="form-label">Pesquisar:</label>
            <input class="form-control" type="text" placeholder="Qual projeto deseja buscar?" (input)="search($event)"/>
        </div>
    </div>

    @if (projetos && projetos.length > 0) {
        <div class="row">
            @for (projeto of projetos; track $index) {
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="post-it-container green project-card">
                        <div class="post-it-content">
                            <h4 class="project-title">{{projeto.nome}}</h4>
                            <p class="project-description">{{projeto.descricao | truncate:50}}</p>

                            <div class="d-flex flex-wrap gap-2 mt-3">
                                <button class="btn btn-postit-sm" [routerLink]="['/editar', projeto.id]" title="Editar">
                                    ✏️
                                </button>
                                <button class="btn btn-postit-sm" [routerLink]="['/detalhes', projeto.id]" title="Detalhes">
                                    🔍
                                </button>
                                <button class="btn btn-postit-sm btn-danger" (click)="deletar(projeto.id)" title="Excluir">
                                    🗑️
                                </button>
                                <button class="btn btn-postit-sm" [routerLink]="['/lista', projeto.id]" title="Tarefas">
                                    ✅
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            }
        </div>
    } @else {
        <div class="post-it-container yellow">
            <div class="post-it-content text-center">
                <h4>Nenhum projeto cadastrado</h4>
                <p>Clique no botão acima para criar seu primeiro projeto!</p>
            </div>
        </div>
    }
</div>
