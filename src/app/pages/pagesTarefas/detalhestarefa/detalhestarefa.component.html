<div class="container mt-5">
  <h1 class="page-title">Detalhes da Tarefa</h1>

  <div class="post-it-container blue">
    <div class="post-it-content">
      <form>
        <div class="mb-3">
          <label class="form-label">Título</label>
          <div class="post-it-field">{{tarefa.titulo}}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <div class="post-it-field">{{tarefa.descricao || 'Nenhuma descrição fornecida'}}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Data da conclusão</label>
          <div class="post-it-field">{{tarefa.dataConclusao | date:'dd/MM/yyyy'}}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Situação</label>
          <div class="post-it-field">{{(tarefa.status)}}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Prioridade</label>
          <div class="post-it-field">{{(tarefa.prioridade)}}</div>
        </div>

        <div class="d-flex mt-3">
          <a class="btn btn-postit-secondary w-100" [routerLink]="['/lista', tarefa.projetoId]">
            ↩️ Voltar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
